# Deploy the static site to GitHub Pages.
#
# What this does on every push to main:
#   1. "build"  — assembles the SunSun JP restaurant site (index.html,
#                 menu.html, styles.css, images/) in ./site/dist and runs a
#                 quick integrity check (no build tools required — the site
#                 is plain static HTML/CSS + JPG photos).
#   2. "deploy" — publishes the built site to GitHub Pages via the official
#                 actions/deploy-pages action.
#
# Trigger: a manual dispatch ("Deploy site" button) as well as pushes to main,
# so you can redeploy on demand and it also runs automatically.

name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'menu.html'
      - 'styles.css'
      - 'images/**'
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

# Only one deploy running at a time; newest wins.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p site/dist
          # The restaurant site: root pages + shared stylesheet + photos.
          cp index.html menu.html styles.css site/dist/
          cp -r images site/dist/images
          # Keep the todo app reachable too (it lives under /todo-list.html).
          cp todo-list.html site/dist/todo-list.html

      - name: Sanity check
        run: |
          test -s site/dist/index.html
          test -s site/dist/menu.html
          test -s site/dist/styles.css
          test -s site/dist/images/interior-counter.jpg
          grep -q "SunSun JP" site/dist/index.html
          echo "build ok: restaurant site assembled"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
