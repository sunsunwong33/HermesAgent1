<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SunSun's Sites</title>
  <meta name="description" content="由首頁選擇想開啟的網站:To-do List 待辦清單,或 SunSun JP 日式餐廳。" />
  <style>
    :root {
      --bg: #0d0c0a;
      --surface: #1a1814;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f0e9dc;
      --muted: #a49a86;
      --faint: #6f6759;
      --gold: #c9a227;
      --green: #35c96f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(900px 500px at 50% -10%, rgba(201, 162, 39, 0.08), transparent 60%), var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      display: grid; place-items: center; padding: 32px 20px;
    }
    .wrap { width: min(720px, 100%); text-align: center; }
    .kicker { font-size: 12px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--faint); margin-bottom: 12px; }
    h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 600; letter-spacing: 0.02em; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 15px; margin-bottom: 44px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    .card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 34px 26px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(201, 162, 39, 0.4); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); }
    .card .icon {
      width: 52px; height: 52px; margin: 0 auto 18px;
      border-radius: 14px; display: grid; place-items: center;
      font-size: 24px;
    }
    .card.todo .icon { background: rgba(53, 201, 111, 0.14); }
    .card.jp .icon { background: rgba(201, 162, 39, 0.14); }
    .card h2 { font-size: 19px; letter-spacing: 0.03em; margin-bottom: 6px; }
    .card p { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
    .card .go { margin-top: 18px; font-size: 13px; letter-spacing: 0.14em; color: var(--faint); }
    .card.todo .go { color: var(--green); }
    .card.jp .go { color: var(--gold); }
    .foot { margin-top: 44px; color: var(--faint); font-size: 12px; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">選擇網站</p>
    <h1>SunSun's Sites</h1>
    <p class="sub">選擇想開啟的網站</p>

    <div class="grid">
      <a class="card todo" href="todo-list.html">
        <div class="icon">✓</div>
        <h2>To-do List 待辦清單</h2>
        <p>單檔應用,待辦事項儲存於瀏覽器本地(localStorage),支援新增、完成與刪除。</p>
        <div class="go">開啟 →</div>
      </a>

      <a class="card jp" href="restaurant.html">
        <div class="icon">🍣</div>
        <h2>SunSun JP 和食 Fusion</h2>
        <p>日式餐廳官方網站:餐廳簡介、招牌菜式、菜單、店內環境、營業時間與訂座。</p>
        <div class="go">開啟 →</div>
      </a>
    </div>

    <p class="foot">GitHub Pages · s
unsunwong33.github.io/HermesAgent1</p>
  </div>
</body>
</html>
